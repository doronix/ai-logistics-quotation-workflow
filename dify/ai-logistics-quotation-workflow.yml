    - data:
        instruction: "你负责从物流/货代客户询盘中提取结构化信息。\n\n严格遵守以下规则：\n\n1. 只提取客户明确提供或可以直接确定的信息。\n\
          2. 不要猜测、补全或编造客户没有提供的信息。\n3. 无法确定的字段保持为空。\n4. weight_kg 统一表示公斤（kg）。\n5. volume_cbm\
          \ 统一表示立方米（CBM）。\n6. transport_mode 仅在客户明确表达运输方式时提取：\n   - air：空运\n   - sea：海运\n\
          \   未明确时保持为空，不要自行选择。\n7. cargo_type 根据客户明确描述提取，例如：\n   - general\n   - dangerous\n\
          \   - battery\n   - food\n   如果无法确定则为空。\n8. ready_date 只提取客户明确给出的日期或时间描述，不要自行推测具体日期。\n\
          9. customer_name 和 customer_email 仅在询盘中明确出现时提取。\n10. 起运地和目的地保持客户表达的实际地点，不要自行改变路线。\n\
          \n最重要的原则：\n\n未知信息必须保持为空。\n不要为了生成完整结果而猜测缺失字段。"
