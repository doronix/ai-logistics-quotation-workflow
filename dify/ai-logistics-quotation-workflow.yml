    - data:
        code: "import json\n\n\ndef main(body: str, status_code: int):\n    # 先检查\
          \ HTTP 层\n    if status_code != 200:\n        return {\n            \"quote_valid\"\
          : False,\n            \"error\": f\"Quote API returned HTTP {status_code}\"\
          ,\n            \"quote_id\": \"\",\n            \"currency\": \"\",\n  \
          \          \"total_price\": 0.0,\n            \"valid_until\": \"\",\n \
          \           \"provider\": \"\",\n            \"estimated_transit_days\"\
          : 0,\n        }\n\n    # 再检查 JSON 层\n    try:\n        data = json.loads(body)\n\
          \    except (json.JSONDecodeError, TypeError):\n        return {\n     \
          \       \"quote_valid\": False,\n            \"error\": \"Quote API returned\
          \ invalid JSON\",\n            \"quote_id\": \"\",\n            \"currency\"\
          : \"\",\n            \"total_price\": 0.0,\n            \"valid_until\"\
          : \"\",\n            \"provider\": \"\",\n            \"estimated_transit_days\"\
          : 0,\n        }\n\n    # 最后检查业务数据层\n    required_fields = [\n        \"\
          quote_id\",\n        \"currency\",\n        \"total_price\",\n        \"\
          valid_until\",\n        \"provider\",\n    ]\n\n    missing_fields = [\n\
          \        field\n        for field in required_fields\n        if data.get(field)\
          \ in (None, \"\")\n    ]\n\n    if missing_fields:\n        return {\n \
          \           \"quote_valid\": False,\n            \"error\": \"Missing quote\
          \ fields: \" + \", \".join(missing_fields),\n            \"quote_id\": \"\
          \",\n            \"currency\": \"\",\n            \"total_price\": 0.0,\n\
          \            \"valid_until\": \"\",\n            \"provider\": \"\",\n \
          \           \"estimated_transit_days\": 0,\n        }\n\n    try:\n    \
          \    total_price = float(data[\"total_price\"])\n    except (TypeError,\
          \ ValueError):\n        total_price = 0.0\n\n    if total_price <= 0:\n\
          \        return {\n            \"quote_valid\": False,\n            \"error\"\
          : \"Quote total_price must be positive\",\n            \"quote_id\": \"\"\
          ,\n            \"currency\": \"\",\n            \"total_price\": 0.0,\n\
          \            \"valid_until\": \"\",\n            \"provider\": \"\",\n \
          \           \"estimated_transit_days\": 0,\n        }\n\n    return {\n\
          \        \"quote_valid\": True,\n        \"error\": \"\",\n        \"quote_id\"\
          : data[\"quote_id\"],\n        \"currency\": data[\"currency\"],\n     \
          \   \"total_price\": total_price,\n        \"valid_until\": data[\"valid_until\"\
          ],\n        \"provider\": data[\"provider\"],\n        \"estimated_transit_days\"\
          : int(\n            data.get(\"estimated_transit_days\", 0)\n        ),\n\
          \    }"
        code_language: python3
