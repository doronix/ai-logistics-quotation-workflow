          )\n\n    if (not weight_kg or weight_kg <= 0) and (not volume_cbm or volume_cbm\
          \ <= 0):\n        missing_fields.append(\"weight_or_volume\")\n\n    if\
          \ not transport_mode:\n        transport_mode_normalized = \"air\"\n   \
          \ else:\n        transport_mode_normalized = transport_mode\n\n    is_valid\
          \ = len(missing_fields) == 0\n\n    return {\n        \"is_valid\": is_valid,\n\
          \        \"missing_fields\": missing_fields,\n        \"transport_mode_normalized\"\
          : transport_mode_normalized,\n    }"
