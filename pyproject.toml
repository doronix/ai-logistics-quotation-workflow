[project]
name = "ai-quotation-demo"
version = "0.1.0"
description = "Deterministic mock freight quotation API for a Dify workflow demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
